<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ProjectGrasp</title>
    <style>
        :root {
            --bg: #ffffff;
            --panel: #f6f7f9;
            --border: #d9dde3;
            --text: #1d2330;
            --muted: #677085;
            --accent: #2f6fde;
            --function: #2f6fde;
            --method: #1f9d74;
            --class: #b7661b;
            --module: #7a8193;
            --edge: #8a93a6;
            --group: #eef1f5;
            --selected: #e8453c;
            --mark: #fff3c4;
            --code-keyword: #a626a4;
            --code-string: #50a14f;
            --code-number: #986801;
            --code-comment: #8a93a6;
            --code-title: #2f6fde;
            --code-meta: #b7661b;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #15181e;
                --panel: #1c2028;
                --border: #2e3440;
                --text: #e3e7ee;
                --muted: #8f98aa;
                --accent: #6b9cff;
                --function: #6b9cff;
                --method: #4cc49b;
                --class: #e39a52;
                --module: #9aa1b2;
                --edge: #6c7486;
                --group: #1f242d;
                --selected: #ff6b61;
                --mark: #3d3520;
                --code-keyword: #d38cf0;
                --code-string: #9ccf7a;
                --code-number: #e3b56b;
                --code-comment: #737c8f;
                --code-title: #7fb0ff;
                --code-meta: #e39a52;
            }
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            align-items: baseline;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            font-size: 16px;
            margin: 0;
        }

        header .root {
            color: var(--muted);
            overflow-wrap: anywhere;
        }

        header .stats {
            margin-left: auto;
            color: var(--muted);
            font-size: 12px;
        }

        main {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        aside {
            width: 300px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 12px 16px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            overflow-x: hidden;
        }

        #canvas {
            flex: 1;
            position: relative;
            min-width: 0;
        }

        #cy {
            position: absolute;
            inset: 0;
        }

        #empty {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: var(--muted);
            pointer-events: none;
            text-align: center;
            padding: 16px;
        }

        #empty[hidden] {
            display: none;
        }

        #code {
            width: 42%;
            min-width: 340px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border);
            background: var(--panel);
        }

        #code[hidden] {
            display: none;
        }

        #code .bar {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            color: var(--muted);
        }

        #code .bar span {
            flex: 1;
            overflow-wrap: anywhere;
        }

        #code-body {
            flex: 1;
            overflow: auto;
            margin: 0;
            padding: 8px 0;
            font: 12px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace;
            background: var(--bg);
        }

        #code-body .ln {
            display: flex;
            white-space: pre;
        }

        #code-body .ln.mark {
            background: var(--mark);
        }

        #code-body .no {
            flex-shrink: 0;
            width: 4.5em;
            padding-right: 1em;
            text-align: right;
            color: var(--muted);
            user-select: none;
        }

        #code-body .note {
            padding: 8px 12px;
            color: var(--muted);
            white-space: normal;
        }

        .hljs-keyword,
        .hljs-built_in,
        .hljs-literal {
            color: var(--code-keyword);
        }

        .hljs-string,
        .hljs-subst {
            color: var(--code-string);
        }

        .hljs-number {
            color: var(--code-number);
        }

        .hljs-comment {
            color: var(--code-comment);
            font-style: italic;
        }

        .hljs-title,
        .hljs-type {
            color: var(--code-title);
        }

        .hljs-meta {
            color: var(--code-meta);
        }

        input[type=search] {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            font: inherit;
        }

        h2 {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: var(--muted);
            margin: 0 0 4px;
        }

        details summary {
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            margin: 6px 0 2px;
        }

        ul.list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        ul.list li {
            padding: 3px 6px;
            border-radius: 4px;
            cursor: pointer;
            overflow-wrap: anywhere;
        }

        ul.list li:hover {
            background: var(--border);
        }

        ul.list .sub {
            color: var(--muted);
            font-size: 12px;
            margin-left: 6px;
        }

        .note {
            color: var(--muted);
            font-size: 13px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        button {
            font: inherit;
            font-size: 13px;
            padding: 4px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            cursor: pointer;
        }

        button:hover {
            border-color: var(--accent);
        }

        #details .title {
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        #details .signature {
            font: 12px/1.4 ui-monospace, Consolas, monospace;
            overflow-wrap: anywhere;
            margin-top: 4px;
        }

        #details .meta {
            color: var(--muted);
            font-size: 12px;
            overflow-wrap: anywhere;
            margin: 4px 0 8px;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
            font-size: 12px;
            color: var(--muted);
        }

        .legend i {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 3px;
            margin-right: 4px;
            vertical-align: -1px;
        }

        .legend .line {
            width: 18px;
            height: 0;
            border-top: 2px solid var(--edge);
            border-radius: 0;
            vertical-align: 3px;
        }

        .legend .dashed {
            border-top-style: dashed;
        }

        @media (max-width: 900px) {
            main {
                flex-direction: column;
                overflow-y: auto;
            }

            aside {
                width: auto;
                max-height: 40vh;
                border-right: 0;
                border-bottom: 1px solid var(--border);
            }

            #canvas {
                min-height: 55vh;
            }

            #code {
                width: auto;
                min-width: 0;
                max-height: 60vh;
                border-left: 0;
                border-top: 1px solid var(--border);
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>ProjectGrasp</h1>
        <span class="root" id="root"></span>
        <span class="stats" id="stats"></span>
    </header>
    <main>
        <aside>
            <input type="search" id="search" placeholder="Search functions, methods, classes…" autocomplete="off">
            <section>
                <h2 id="list-title">Entry points</h2>
                <div id="list"></div>
            </section>
            <section id="details" hidden>
                <h2>Selected</h2>
                <div class="title" id="d-title"></div>
                <div class="signature" id="d-signature"></div>
                <div class="meta" id="d-meta"></div>
                <div class="buttons" id="d-buttons"></div>
            </section>
            <section class="options">
                <h2>View</h2>
                <label><input type="checkbox" id="opt-group" checked> Group by file</label>
                <label><input type="checkbox" id="opt-possible" checked> Show possible calls</label>
                <label><input type="checkbox" id="opt-tests" checked> Hide tests</label>
                <div class="buttons">
                    <button id="btn-fit">Fit</button>
                    <button id="btn-clear">Clear</button>
                </div>
            </section>
            <section>
                <h2>Legend</h2>
                <div class="legend">
                    <span><i style="background:var(--function)"></i>function</span>
                    <span><i style="background:var(--method)"></i>method</span>
                    <span><i style="background:var(--class)"></i>class</span>
                    <span><i style="background:var(--module)"></i>module code</span>
                    <span><i class="line"></i>certain call</span>
                    <span><i class="line dashed"></i>possible call</span>
                </div>
            </section>
        </aside>
        <div id="canvas">
            <div id="cy"></div>
            <div id="empty">Pick an entry point or search for a function to start.<br>Double-click a node to expand what
                it calls.</div>
        </div>
        <section id="code" hidden>
            <div class="bar"><span id="code-title"></span><button id="btn-code-close">Close</button></div>
            <pre id="code-body"></pre>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
        "use strict";
        const DATA = /*__GRASP_DATA__*/null;
        const SOURCES = /*__GRASP_SOURCES__*/null;

        if (typeof cytoscape === "undefined") {
            document.getElementById("empty").textContent =
                "Could not load Cytoscape.js from the CDN. This page needs an internet connection.";
            throw new Error("cytoscape not loaded");
        }

        const MAX_RESULTS = 50;
        const MAX_CODE_LINES = 400;
        const ENTRY_GROUPS = [
            ["script", "Scripts"],
            ["main", "Programs"],
            ["task", "Background tasks"],
            ["cli", "CLI commands"],
            ["route", "Routes & handlers"],
            ["reach", "Other starting points"],
        ];

        // -- graph indexes ----------------------------------------------------------

        const nodesById = new Map(DATA.nodes.map(n => [n.id, n]));
        const outgoing = new Map();  // id -> edges leaving it
        const incoming = new Map();  // id -> edges entering it
        for (const e of DATA.edges) {
            if (!outgoing.has(e.source)) outgoing.set(e.source, []);
            if (!incoming.has(e.target)) incoming.set(e.target, []);
            outgoing.get(e.source).push(e);
            incoming.get(e.target).push(e);
        }

        const state = {
            visible: new Set(),
            selected: null,  // node id, or an edge object
            groupByFile: true,
            showPossible: true,
            hideTests: true,
        };

        function shown(e, end) {
            if (!state.showPossible && e.confidence !== "certain") return false;
            return !(state.hideTests && nodesById.get(e[end]).is_test);
        }
        const outEdges = id => (outgoing.get(id) || []).filter(e => shown(e, "target"));
        const inEdges = id => (incoming.get(id) || []).filter(e => shown(e, "source"));
        const callees = id => outEdges(id).map(e => e.target);
        const callers = id => inEdges(id).map(e => e.source);

        function label(node) {
            if (node.kind === "module") return node.module + " (module code)";
            return node.qualname.replaceAll(".<locals>.", " › ");
        }

        function signature(node) {
            if (node.kind === "module") return "";
            if (node.kind === "class") return `class ${node.qualname.split(".").pop()}`;
            const ret = node.returns ? ` -> ${node.returns}` : "";
            return `def ${node.qualname.split(".").pop()}(${node.params.join(", ")})${ret}`;
        }

        // What an arrow into `node` carries, from the callee's own annotations.
        function edgeLabel(node) {
            const typed = node.params.filter(p => p.includes(":") && !/^(self|cls)\b/.test(p));
            if (!typed.length && !node.returns) return "";
            return `(${typed.join(", ")})` + (node.returns ? ` → ${node.returns}` : "");
        }

        // -- graph rendering --------------------------------------------------------

        const $ = id => document.getElementById(id);

        function themeColor(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }

        function cyStyle() {
            const c = name => themeColor(name);
            return [
                {
                    selector: "node",
                    style: {
                        "label": "data(label)",
                        "font-size": 11,
                        "color": c("--text"),
                        "text-valign": "center",
                        "text-halign": "center",
                        "shape": "round-rectangle",
                        "width": ele => Math.max(40, ele.data("label").length * 6.6 + 18),
                        "height": 26,
                        "background-color": c("--bg"),
                        "border-width": 2,
                        "border-color": c("--function"),
                    },
                },
                { selector: "node[kind = 'method']", style: { "border-color": c("--method") } },
                { selector: "node[kind = 'class']", style: { "border-color": c("--class"), "shape": "hexagon" } },
                { selector: "node[kind = 'module']", style: { "border-color": c("--module"), "border-style": "dashed" } },
                { selector: "node[?more]", style: { "border-width": 3, "font-weight": "bold" } },
                {
                    selector: ":parent",
                    style: {
                        "label": "data(label)",
                        "text-valign": "top",
                        "text-halign": "center",
                        "font-size": 11,
                        "color": c("--muted"),
                        "background-color": c("--group"),
                        "background-opacity": 1,
                        "border-width": 1,
                        "border-color": c("--border"),
                        "shape": "round-rectangle",
                        "padding": 12,
                    },
                },
                {
                    selector: "edge",
                    style: {
                        "width": 1.5,
                        "line-color": c("--edge"),
                        "target-arrow-color": c("--edge"),
                        "target-arrow-shape": "triangle",
                        "curve-style": "bezier",
                        "arrow-scale": 0.9,
                    },
                },
                { selector: "edge[confidence = 'possible']", style: { "line-style": "dashed" } },
                {
                    // Placed near the arrowhead: edges fanning out of one node would stack labels at their middles.
                    selector: "edge.labeled",
                    style: {
                        "target-label": "data(label)",
                        "target-text-offset": 60,
                        "font-size": 10,
                        "color": c("--text"),
                        "text-background-color": c("--bg"),
                        "text-background-opacity": 0.9,
                        "text-background-padding": 2,
                    },
                },
                { selector: "node:selected", style: { "border-color": c("--selected"), "border-width": 3 } },
                { selector: "edge:selected", style: { "line-color": c("--selected"), "target-arrow-color": c("--selected"), "width": 2.5 } },
            ];
        }

        if (typeof cytoscapeDagre !== "undefined") {
            try { cytoscape.use(cytoscapeDagre); } catch (err) { /* already registered */ }
        }

        const cy = cytoscape({
            container: $("cy"),
            style: cyStyle(),
            minZoom: 0.1,
            maxZoom: 3,
        });

        function render() {
            const elements = [];
            const groups = new Set();
            for (const id of state.visible) {
                const node = nodesById.get(id);
                const hidden = callees(id).filter(t => !state.visible.has(t)).length;
                const data = { id, kind: node.kind, label: label(node) + (hidden ? `  +${hidden}` : ""), more: hidden > 0 };
                if (state.groupByFile) {
                    data.parent = "@file:" + node.path;
                    groups.add(node.path);
                }
                elements.push({ group: "nodes", data });
            }
            for (const path of groups) {
                elements.push({ group: "nodes", data: { id: "@file:" + path, label: path } });
            }
            for (const id of state.visible) {
                for (const e of outEdges(id)) {
                    if (!state.visible.has(e.target)) continue;
                    elements.push({
                        group: "edges",
                        data: {
                            id: `${e.source}->${e.target}`, source: e.source, target: e.target,
                            confidence: e.confidence, label: edgeLabel(nodesById.get(e.target)),
                        },
                    });
                }
            }

            cy.batch(() => {
                cy.elements().remove();
                cy.add(elements);
            });
            markSelection();
            $("empty").hidden = state.visible.size > 0;
            cy.layout({ name: hasDagre() ? "dagre" : "breadthfirst", rankDir: "LR", nodeSep: 18, rankSep: 70, padding: 30, directed: true }).run();
        }

        function hasDagre() {
            return typeof dagre !== "undefined" && typeof cytoscapeDagre !== "undefined";
        }

        // Selects the current node or edge in the graph and labels the edges around it.
        function markSelection() {
            cy.elements().unselect();
            cy.edges().removeClass("labeled");
            const sel = state.selected;
            if (typeof sel === "string" && state.visible.has(sel)) {
                const node = cy.getElementById(sel);
                node.select();
                node.connectedEdges().addClass("labeled");
            } else if (sel && typeof sel === "object") {
                cy.getElementById(`${sel.source}->${sel.target}`).select().addClass("labeled");
            }
        }

        // -- actions ----------------------------------------------------------------

        function focusOn(id) {
            state.visible = new Set([id, ...callers(id), ...callees(id)]);
            selectNode(id);
            render();
        }

        function expand(id, direction) {
            const ids = direction === "callers" ? callers(id) : callees(id);
            ids.forEach(t => state.visible.add(t));
            state.visible.add(id);
            render();
        }

        function hide(id) {
            state.visible.delete(id);
            if (state.selected === id) clearSelection();
            render();
        }

        function clearSelection() {
            state.selected = null;
            $("details").hidden = true;
            setCodeVisible(false);
            markSelection();
        }

        function selectNode(id) {
            state.selected = id;
            const node = nodesById.get(id);
            showDetails(
                label(node),
                signature(node),
                `${node.kind} · ${node.module} · ${node.path}:${node.line}` + (node.is_test ? " · test" : ""),
                [
                    button(`Calls (${callees(id).length})`, () => expand(id, "callees")),
                    button(`Called by (${callers(id).length})`, () => expand(id, "callers")),
                    button("Focus", () => focusOn(id)),
                    button("Hide", () => hide(id)),
                ],
            );
            showCode(node, []);
            markSelection();
        }

        function selectEdge(edge) {
            state.selected = edge;
            const source = nodesById.get(edge.source);
            const target = nodesById.get(edge.target);
            showDetails(
                `${label(source)} → ${label(target)}`,
                signature(target),
                `${edge.confidence} call · line ${edge.lines.join(", ")}`,
                [
                    button("Go to caller", () => selectNode(edge.source)),
                    button("Go to callee", () => selectNode(edge.target)),
                ],
            );
            showCode(source, edge.lines);
            markSelection();
        }

        function showDetails(title, sig, meta, buttons) {
            $("details").hidden = false;
            $("d-title").textContent = title;
            $("d-signature").textContent = sig;
            $("d-meta").textContent = meta;
            $("d-buttons").replaceChildren(...buttons);
        }

        function button(text, onClick) {
            const b = document.createElement("button");
            b.textContent = text;
            b.addEventListener("click", onClick);
            return b;
        }

        // -- source panel -----------------------------------------------------------

        // Opening or closing the panel changes the canvas width, which Cytoscape must be told about.
        function setCodeVisible(visible) {
            if ($("code").hidden !== visible) return;
            $("code").hidden = !visible;
            cy.resize();
            if (state.visible.size) cy.fit(undefined, 30);
        }

        function showCode(node, marks) {
            setCodeVisible(true);
            const body = $("code-body");
            const text = SOURCES[node.path];
            if (text == null) {
                $("code-title").textContent = node.path;
                body.innerHTML = '<div class="note">Source not available.</div>';
                return;
            }
            const lines = text.split(/\r?\n/);
            const start = node.kind === "module" ? 1 : node.line;
            const last = node.kind === "module" ? lines.length : node.end_line;
            const end = Math.min(last, start + MAX_CODE_LINES - 1);
            $("code-title").textContent = `${node.path}:${start}–${end}`;

            const highlighted = highlightLines(lines.slice(start - 1, end).join("\n"));
            body.innerHTML = highlighted.map((html, i) => {
                const no = start + i;
                const cls = marks.includes(no) ? "ln mark" : "ln";
                return `<div class="${cls}"><span class="no">${no}</span><span>${html || " "}</span></div>`;
            }).join("") + (end < last ? `<div class="note">… ${last - end} more lines</div>` : "");

            const first = body.querySelector(".mark");
            if (first) first.scrollIntoView({ block: "center" });
            else body.scrollTop = 0;
        }

        // Highlights a snippet and splits the HTML into lines, closing and reopening
        // any <span> that crosses a line break (multi-line strings, for example).
        function highlightLines(code) {
            const html = typeof hljs === "undefined"
                ? escapeHtml(code)
                : hljs.highlight(code, { language: "python", ignoreIllegals: true }).value;
            const lines = [];
            const open = [];
            let current = "";
            for (const m of html.matchAll(/(<span[^>]*>)|(<\/span>)|(\n)|([^<\n]+)/g)) {
                if (m[1]) { open.push(m[1]); current += m[1]; }
                else if (m[2]) { open.pop(); current += m[2]; }
                else if (m[3]) { lines.push(current + "</span>".repeat(open.length)); current = open.join(""); }
                else current += m[4];
            }
            lines.push(current + "</span>".repeat(open.length));
            return lines;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // -- sidebar list -----------------------------------------------------------

        function listItem(node, sub) {
            const li = document.createElement("li");
            li.textContent = label(node);
            const span = document.createElement("span");
            span.className = "sub";
            span.textContent = sub;
            li.append(span);
            li.addEventListener("click", () => focusOn(node.id));
            return li;
        }

        function showEntryPoints() {
            $("list-title").textContent = "Entry points";
            const sections = [];
            for (const [kind, title] of ENTRY_GROUPS) {
                const entries = DATA.entry_points.filter(e => e.kind === kind).sort((a, b) => b.reach - a.reach);
                if (!entries.length) continue;
                const details = document.createElement("details");
                details.open = entries.length <= 10;
                const summary = document.createElement("summary");
                summary.textContent = `${title} (${entries.length})`;
                const ul = document.createElement("ul");
                ul.className = "list";
                ul.append(...entries.map(e => listItem(nodesById.get(e.id), `reaches ${e.reach}`)));
                details.append(summary, ul);
                sections.push(details);
            }
            if (!sections.length) {
                const p = document.createElement("p");
                p.className = "note";
                p.textContent = "No entry points found. Search for a function instead.";
                sections.push(p);
            }
            $("list").replaceChildren(...sections);
        }

        function showMatches(query) {
            const q = query.toLowerCase();
            const items = DATA.nodes
                .filter(n => !(state.hideTests && n.is_test) && n.id.toLowerCase().includes(q))
                .slice(0, MAX_RESULTS);
            $("list-title").textContent = `Matches (${items.length}${items.length === MAX_RESULTS ? "+" : ""})`;
            const ul = document.createElement("ul");
            ul.className = "list";
            ul.append(...items.map(n => listItem(n, n.kind === "module" ? n.path : n.module)));
            $("list").replaceChildren(ul);
        }

        function showList() {
            const query = $("search").value.trim();
            if (query) showMatches(query);
            else showEntryPoints();
        }

        // -- wiring -----------------------------------------------------------------

        cy.on("tap", "node", evt => {
            const id = evt.target.id();
            if (nodesById.has(id)) selectNode(id);
        });
        cy.on("dbltap", "node", evt => {
            const id = evt.target.id();
            if (nodesById.has(id)) expand(id, "callees");
        });
        cy.on("tap", "edge", evt => {
            const { source, target } = evt.target.data();
            const edge = (outgoing.get(source) || []).find(e => e.target === target);
            if (edge) selectEdge(edge);
        });
        cy.on("tap", evt => { if (evt.target === cy) clearSelection(); });
        cy.on("mouseover", "edge", evt => evt.target.addClass("labeled"));
        cy.on("mouseout", "edge", () => markSelection());

        function refresh() {
            if (typeof state.selected === "string") selectNode(state.selected);  // button counts depend on filters
            showList();
            render();
        }

        $("search").addEventListener("input", showList);
        $("opt-group").addEventListener("change", e => { state.groupByFile = e.target.checked; render(); });
        $("opt-possible").addEventListener("change", e => { state.showPossible = e.target.checked; refresh(); });
        $("opt-tests").addEventListener("change", e => { state.hideTests = e.target.checked; refresh(); });
        $("btn-fit").addEventListener("click", () => cy.fit(undefined, 30));
        $("btn-clear").addEventListener("click", () => { state.visible.clear(); clearSelection(); render(); });
        $("btn-code-close").addEventListener("click", () => setCodeVisible(false));
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => cy.style(cyStyle()));

        const s = DATA.stats;
        $("root").textContent = DATA.root;
        $("stats").textContent =
            `${s.files} files · ${DATA.nodes.length} nodes · ${DATA.edges.length} edges · ` +
            `calls: ${s.certain} certain, ${s.possible} possible, ${s.unresolved} unresolved`;
        showList();

        // #focus=<node id> opens the page focused on that node, e.g. #focus=pkg.mod:main
        const initial = new URLSearchParams(location.hash.slice(1)).get("focus");
        if (initial && nodesById.has(initial)) focusOn(initial);
    </script>
</body>

</html>
