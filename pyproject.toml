[project]
name = "projectgrasp"
version = "0.1.0"
description = "Lightweight, interactive function call graphs for reading unfamiliar code."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
]

[project.scripts]
grasp = "grasp.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grasp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
